<!DOCTYPE html>
<html lang="en" class="dark h-full"
  x-data="{
    dark: localStorage.getItem('crq-theme') !== 'light',
    sidebarOpen: false,
    logoutOpen: false,
    notifOpen: false,
    get notifications() { return ($store.crqBell && $store.crqBell.items) ? $store.crqBell.items : []; }
  }"
  x-init="
    $watch('dark', v => {
      document.documentElement.classList.toggle('dark', v);
      document.documentElement.classList.toggle('light', !v);
      localStorage.setItem('crq-theme', v ? 'dark' : 'light');
    });
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.classList.toggle('light', !dark);
  "
  :class="{ 'dark': dark, 'light': !dark }">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Client-RaQ{% endblock %}</title>
  <meta name="description" content="Client-RaQ — AI customer assistant for WhatsApp and Telegram. Printing, beauty, phone repair, retail, logistics, real estate, and more. Multi-tenant automation for growing businesses.">
  <meta name="keywords" content="WhatsApp business bot, Telegram business bot, AI customer service, multi-tenant SaaS, printing bot, phone repair bot, Nigeria business automation, Client RaQ">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Client-RaQ — AI for WhatsApp & Telegram businesses">
  <meta property="og:description" content="Configure your business once. Your AI assistant handles customer chats, quotes, and orders on WhatsApp and Telegram.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://clientraq.com">
  <link rel="canonical" href="https://clientraq.com">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo-dark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface-base': 'var(--surface-base)',
            'surface-canvas': 'var(--surface-canvas)',
            'surface-subtle': 'var(--surface-subtle)',
            'surface-card': 'var(--surface-card)',
            'surface-card-hover': 'var(--surface-card-hover)',
            'border-subtle': 'var(--border-subtle)',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
            'text-muted': 'var(--text-muted)',
            primary: { DEFAULT: 'var(--primary)', hover: 'var(--primary-hover)' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/design-system.css">
  <script>
    document.addEventListener('alpine:init', function () {
      Alpine.store('crqBell', {
        items: [],
        setItems: function (list) {
          this.items = (list || []).map(function (n) {
            return Object.assign({}, n, { time: n.created_at || n.time || '' });
          });
        },
        remove: function (id) {
          this.items = this.items.filter(function (n) { return n.id !== id; });
        }
      });
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak]{display:none!important}</style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-[var(--surface-base)] text-[var(--text-primary)] font-sans antialiased">
  {% block body %}{% endblock %}

<script>
(function(){
  if (window.crqConfirm) return;
  window.crqConfirm = function(message, opts){
    opts = opts || {};
    return new Promise(function(resolve){
      var existing = document.getElementById('crq-confirm-modal');
      if (existing) existing.remove();
      var overlay = document.createElement('div');
      overlay.id = 'crq-confirm-modal';
      overlay.setAttribute('role', 'dialog');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(15,23,42,.45);';
      var panel = document.createElement('div');
      panel.style.cssText = 'width:min(24rem,100%);background:var(--surface-card,#fff);color:var(--text-primary,#0f172a);border:1px solid var(--border-subtle,#e5e7eb);border-radius:1rem;padding:1.25rem 1.25rem 1rem;box-shadow:0 25px 50px rgba(0,0,0,.18);';
      panel.innerHTML = '<p style="margin:0 0 1.25rem;font-size:.95rem;line-height:1.5;font-weight:500;"></p>' +
        '<div style="display:flex;gap:.75rem;justify-content:flex-end;flex-wrap:wrap;">' +
        '<button type="button" data-act="cancel" style="min-height:44px;padding:.5rem 1rem;border-radius:.75rem;border:1px solid var(--border-subtle,#e5e7eb);background:transparent;cursor:pointer;font-size:.875rem;">Cancel</button>' +
        '<button type="button" data-act="ok" style="min-height:44px;padding:.5rem 1.1rem;border-radius:.75rem;border:none;background:var(--primary,#2563eb);color:#fff;cursor:pointer;font-size:.875rem;font-weight:600;">OK</button>' +
        '</div>';
      panel.querySelector('p').textContent = message || 'Are you sure?';
      if (opts.okText) panel.querySelector('[data-act=ok]').textContent = opts.okText;
      if (opts.cancelText) panel.querySelector('[data-act=cancel]').textContent = opts.cancelText;
      if (opts.danger) panel.querySelector('[data-act=ok]').style.background = '#dc2626';
      function close(v){ overlay.remove(); resolve(v); }
      panel.querySelector('[data-act=cancel]').onclick = function(){ close(false); };
      panel.querySelector('[data-act=ok]').onclick = function(){ close(true); };
      overlay.onclick = function(e){ if (e.target === overlay) close(false); };
      overlay.appendChild(panel);
      document.body.appendChild(overlay);
    });
  };
})();
</script>

</body>
</html>
