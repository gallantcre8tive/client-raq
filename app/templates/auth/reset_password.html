{% extends "base.html" %}
{% block title %}Set new password – Client-RaQ{% endblock %}
{% block body %}
<div class="min-h-screen bg-[var(--surface-canvas)] text-[var(--text-primary)]">
  <div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-2">Set new password</h1>
    <p class="text-sm text-[var(--text-secondary)] mb-6">Enter the code from your email and choose a new password.</p>
    {% if error %}<div class="mb-4 p-3 rounded-xl border border-red-500/40 bg-red-500/10 text-sm">{{ error }}</div>{% endif %}
    <form method="post" action="/company/reset-password" class="card p-6 space-y-4" x-data="{loading:false}" @submit="loading=true">
      <div>
        <label class="block text-xs font-medium mb-1.5">Email</label>
        <input type="email" name="email" value="{{ email|default('') }}" required class="input-field min-h-[44px]">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5">Reset code</label>
        <input type="text" name="code" required class="input-field min-h-[44px] tracking-widest" inputmode="numeric">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5">New password</label>
        <input type="password" name="password" required minlength="6" class="input-field min-h-[44px]" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary w-full min-h-[48px]" :disabled="loading">
        <span x-show="!loading">Update password</span>
        <span x-show="loading">Saving…</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
