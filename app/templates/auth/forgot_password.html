{% extends "base.html" %}
{% block title %}Forgot password – Client-RaQ{% endblock %}
{% block body %}
<div class="min-h-screen bg-[var(--surface-canvas)] text-[var(--text-primary)]">
  <div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-2">Reset password</h1>
    <p class="text-sm text-[var(--text-secondary)] mb-6">Enter your company account email. We will send a reset code.</p>
    {% if error %}<div class="mb-4 p-3 rounded-xl border border-red-500/40 bg-red-500/10 text-sm">{{ error }}</div>{% endif %}
    {% if message %}<div class="mb-4 p-3 rounded-xl border border-[var(--primary)]/30 text-sm">{{ message }}</div>{% endif %}
    <form method="post" action="/company/forgot-password" class="card p-6 space-y-4" x-data="{loading:false}" @submit="loading=true">
      <div>
        <label class="block text-xs font-medium mb-1.5">Email</label>
        <input type="email" name="email" required class="input-field min-h-[44px]">
      </div>
      <button type="submit" class="btn-primary w-full min-h-[48px]" :disabled="loading">
        <span x-show="!loading">Send reset code</span>
        <span x-show="loading">Sending…</span>
      </button>
    </form>
    <p class="mt-6 text-xs text-center text-[var(--text-muted)]">
      <a href="/company/login" class="text-[var(--primary)] hover:opacity-80">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
